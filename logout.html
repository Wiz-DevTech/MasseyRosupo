<meta name="robots" content="noindex, nofollow">

  <title>Signed Out — Massey &amp; Rosupo Co.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0e1116;color:#e8e2d0;font-family:'DM Sans',sans-serif;text-align:center}
    .card{max-width:420px;padding:48px 32px;border:1px solid #2a2f3a;border-radius:12px;background:#14181f}
    h1{font-family:'Cormorant Garamond',serif;font-weight:500;letter-spacing:.02em;margin:0 0 8px}
    p{color:#9aa3b2;font-size:14px;line-height:1.6;margin:0 0 24px}
    a.btn{display:inline-block;padding:10px 22px;border:1px solid #c8a96a;color:#c8a96a;text-decoration:none;border-radius:6px;font-size:14px;letter-spacing:.04em}
    a.btn:hover{background:#c8a96a;color:#0e1116}
    a.alt{display:block;margin-top:16px;color:#6b7380;font-size:13px;text-decoration:underline}
  </style>
</head>
<body>
  <div class="card">
    <h1>Signed Out</h1>
    <p>Your session has been ended. You can sign back in to either portal below.</p>
    <a class="btn" href="/">Return to Main Site</a>
    <a class="alt" href="/admin-portal.html">Trustee Portal</a>
    <a class="alt" href="/portal-login.html">Client Portal</a>
  </div>
  <script>
    // End the Keycloak realm session so the next sign-in can pick a different user.
    (function () {
      var idt = localStorage.getItem('mrIdToken') || '';
      localStorage.removeItem('mrToken');
      localStorage.removeItem('mrRefresh');
      localStorage.removeItem('mrIdToken');
      var p = new URLSearchParams({ client_id: 'massey-admin' });
      if (idt) p.set('id_token_hint', idt);
      p.set('post_logout_redirect_uri', window.location.origin + '/');
      window.location.replace(
        'https://ciphernexid.wisdomignited.com/realms/ciphernex/protocol/openid-connect/logout?' + p.toString()
      );
    })();
  </script>
</body>
</html>
